<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` report anything but zero. Without it
         iOS letterboxes the page inside the safe area and the insets are all 0, so every rule that reads
         them silently does nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#181b17" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Wherever, Honestly</title>
    <meta
      name="description"
      content='Because "I&apos;m fine with whatever" is a lie and everyone knows it.'
    />

    <!-- Open Graph: rich preview when someone shares the link, which is the only way anyone joins.
         The image URL must be absolute; crawlers do not resolve a relative one against the page, so
         "/og.png" meant no preview image anywhere. VITE_SITE_URL is substituted at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Wherever, Honestly" />
    <meta
      property="og:description"
      content='Because "I&apos;m fine with whatever" is a lie and everyone knows it.'
    />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wherever, Honestly: a group picks dinner by swiping." />
    <meta name="twitter:image:alt" content="Wherever, Honestly: a group picks dinner by swiping." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wherever, Honestly" />
    <meta
      name="twitter:description"
      content='Because "I&apos;m fine with whatever" is a lie and everyone knows it.'
    />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
