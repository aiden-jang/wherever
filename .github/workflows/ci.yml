name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run gates
      - run: pnpm run size
      - run: pnpm run comments
      - run: pnpm run css-vars
      - run: pnpm run check:docs
      - run: pnpm run knip
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
      # Emitted CSS is needed to validate Tailwind class usage.
      - run: pnpm run dead-classes
      - run: pnpm run test
      - run: pnpm --filter @wherever/web exec playwright install --with-deps chromium webkit
      - run: pnpm run e2e
      - name: Retain browser and Worker diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics
          path: |
            packages/web/test-results/
            .wrangler/e2e-logs/
          include-hidden-files: true
          retention-days: 7

  # Merge-to-main delivery depends on the complete check job.

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-wherever
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Validation ran in check; this fresh runner builds assets and applies migrations before shipping.
      - name: Deploy Worker and assets to Cloudflare
        run: pnpm run deploy:only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
