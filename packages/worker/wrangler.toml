name = "wherever"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Daily prune of sessions + visited-history older than the TTL (see pruneOldSessions in index.ts),
# so D1 doesn't grow without bound. 4am UTC = low traffic.
[triggers]
crons = ["0 4 * * *"]

[vars]
# This Worker's own public origin, used to build absolute photo-proxy URLs the web app loads
# cross-origin. Must match the custom_domain route below.

# Restaurant data source. "google" uses Google Places (New) and requires the GOOGLE_PLACES_API_KEY
# secret; without that key it safely falls back to the seeded mock deck. "mock" forces the demo deck.
RESTAURANT_SOURCE = "google"

# Monthly circuit breaker: once this many paid Google calls happen in a UTC month, the app stops
# calling Google and serves fallbacks, so usage stays inside the free tier (1,000/month each for
# Nearby Search Enterprise and Place Photos). Set just under 1,000 for margin. See UsageMeter.
SEARCH_MONTHLY_CAP = "950"
PHOTO_MONTHLY_CAP = "950"

# One Durable Object per session. The instance holds live vote state and owns
# every WebSocket for that session.
[[durable_objects.bindings]]
name = "SESSION_ROOM"
class_name = "SessionRoom"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# Single global instance counting paid Google calls per month (see UsageMeter).
[[durable_objects.bindings]]
name = "USAGE_METER"
class_name = "UsageMeter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["UsageMeter"]

# Durable cross-session data: session records + visited-places history.
[[d1_databases]]
binding = "DB"
database_name = "wherever"
database_id = "bc8f7c67-ddf5-40ee-af38-7cee0697bc9a"
migrations_dir = "migrations"

# Custom domain for the API. The web app (Cloudflare Pages) lives at
# wherever.aidenjang.com; the Worker serves the API from this subdomain. Provisioned on
# `wrangler deploy`. workers.dev stays enabled during the cutover so the currently-live
# frontend keeps working until it's rebuilt to point here.
# One origin serves the SPA and the API, so there is no CORS and one deploy instead of two.
# run_worker_first: the Worker sees every request; /api/* and /ws/* are handled here and the
# catch-all in index.ts hands everything else to ASSETS.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# custom_domain, because this hostname has no DNS record of its own — Cloudflare creates and
# manages one pointing here. A plain route cannot work without a record to attach to.
# If a deploy ever fails with 100117 ("already has externally managed DNS records"), something
# else owns the hostname: delete that record first rather than switching to a route.
[[routes]]
pattern = "wherever.aidenjang.com"
custom_domain = true

# The old API-only host. Kept so a page loaded before the merge, or a cached service worker,
# keeps working. Safe to remove once nobody is on the old bundle.
[[routes]]
pattern = "api.wherever.aidenjang.com"
custom_domain = true

# Workers Logs — native, free-tier error/log observability. Tail live with `wrangler tail`;
# browse + query in the dashboard (Workers & Pages → the worker → Logs).
[observability]
enabled = true
head_sampling_rate = 1
