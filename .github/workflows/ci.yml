name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  # Auto-deploy to Cloudflare on merge to main, only after the checks above pass.
  # Requires a CLOUDFLARE_API_TOKEN repo secret (Workers-scoped). Wrangler infers the
  # account from the token, so no account_id is needed here.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-wherever
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Code deploy only. D1 schema changes are applied deliberately by hand, from
      # packages/worker: wrangler d1 migrations apply wherever --remote
      - name: Deploy Worker to Cloudflare
        run: pnpm run deploy
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Build the web app pointing at the API's custom domain (baked into the bundle at build time)
      # and publish it to Cloudflare Pages, so the frontend auto-deploys alongside the Worker.
      # NOTE: CLOUDFLARE_API_TOKEN must include Pages:Edit (not just Workers). Don't also enable a
      # Pages "connect to Git" integration in the dashboard, or you'll get two competing deploys.
      - name: Build + deploy web to Cloudflare Pages
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_API_BASE: "https://api.wherever.aidenjang.com"
          VITE_WS_BASE: "wss://api.wherever.aidenjang.com"
        run: |
          pnpm build
          pnpm dlx wrangler@3 pages deploy dist --project-name wherever --branch main
