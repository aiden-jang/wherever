name = "wherever"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Daily prune of sessions + visited-history older than the TTL (see pruneOldSessions in index.ts),
# so D1 doesn't grow without bound. 4am UTC = low traffic.
[triggers]
crons = ["0 4 * * *"]

[vars]
# Restaurant data source. "google" uses Google Places (New) and requires the GOOGLE_PLACES_API_KEY
# secret; without that key it safely falls back to the seeded mock deck. "mock" forces the demo deck.
RESTAURANT_SOURCE = "google"

# Monthly application reservations for search/photo calls. Provider quotas and billing are separate.
SEARCH_MONTHLY_CAP = "950"
PHOTO_MONTHLY_CAP = "950"

# Product events, written fire-and-forget from the session room. One dataset across every app,
# with the app name in index1 and blob1, so a single query can compare them.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "aidenjang_events"

[[durable_objects.bindings]]
name = "SESSION_ROOM"
class_name = "SessionRoom"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# Single global instance counting paid Google calls per month (see UsageMeter).
[[durable_objects.bindings]]
name = "USAGE_METER"
class_name = "UsageMeter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["UsageMeter"]

# Durable cross-session data: session records + visited-places history.
[[d1_databases]]
binding = "DB"
database_name = "wherever"
database_id = "bc8f7c67-ddf5-40ee-af38-7cee0697bc9a"
migrations_dir = "migrations"

# One Worker serves API, WebSockets, and SPA assets. The catch-all hands other requests to ASSETS.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# custom_domain, because this hostname has no DNS record of its own — Cloudflare creates and
# manages one pointing here. A plain route cannot work without a record to attach to.
# If a deploy ever fails with 100117 ("already has externally managed DNS records"), something
# else owns the hostname: delete that record first rather than switching to a route.
[[routes]]
pattern = "wherever.aidenjang.com"
custom_domain = true


# Workers Logs — native, free-tier error/log observability. Tail live with `wrangler tail`;
# browse + query in the dashboard (Workers & Pages → the worker → Logs).
[observability]
enabled = true
head_sampling_rate = 1
